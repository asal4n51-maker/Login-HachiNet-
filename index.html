<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - HACHI NET WARNASARI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: #040914;
      background-image:
        radial-gradient(circle at 50% 30%, rgba(250, 204, 21, 0.14), transparent 55%),
        linear-gradient(rgba(4, 9, 20, 0.45), rgba(4, 9, 20, 0.65)),
        url('background-hachinet.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #ffffff;
    }

    /* Kartu kaca semi-transparan: terlihat jelas batas & kilau kacanya, tapi tetap tembus pandang */
    .glass-card {
      width: 100%;
      max-width: 380px;
      padding: 30px 24px 26px;
      border-radius: 22px;
      background: linear-gradient(
        160deg,
        rgba(15, 25, 45, 0.42) 0%,
        rgba(8, 14, 28, 0.56) 100%
      );
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1.5px solid rgba(255, 255, 255, 0.34);
      box-shadow:
        0 18px 42px rgba(0, 0, 0, 0.65),
        inset 0 0 20px rgba(250, 204, 21, 0.1),
        0 0 16px rgba(59, 130, 246, 0.22);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .glass-card::before {
      content: "";
      position: absolute;
      top: -45px;
      left: 50%;
      transform: translateX(-50%);
      width: 230px;
      height: 120px;
      background: radial-gradient(circle, rgba(253, 224, 71, 0.38) 0%, transparent 70%);
      pointer-events: none;
    }

    .logo-header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .music-note {
      font-size: 20px;
      color: #fde047;
      text-shadow: 0 0 10px rgba(250, 204, 21, 0.9);
    }

    .bee-badge {
      font-size: 46px;
      line-height: 1;
      filter: drop-shadow(0 0 16px rgba(250, 204, 21, 0.95));
    }

    /* Ukuran judul diperbesar sedikit */
    .title-main {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 1.2px;
      line-height: 1.08;
      color: #fef08a;
      text-shadow:
        0 0 16px rgba(250, 204, 21, 0.72),
        0 3px 8px rgba(0, 0, 0, 0.92);
    }

    .title-sub {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1.4px;
      line-height: 1.12;
      color: #fde047;
      margin-bottom: 24px;
      text-shadow:
        0 0 16px rgba(250, 204, 21, 0.68),
        0 3px 8px rgba(0, 0, 0, 0.92);
    }

    .form-group {
      text-align: left;
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 13.5px;
      font-weight: 600;
      color: #f8fafc;
      margin-bottom: 6px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
    }

    /* Kotak input semi-transparan agar terlihat jelas namun tetap tembus latar */
    .input-wrapper {
      display: flex;
      align-items: center;
      height: 42px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.38);
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .input-wrapper:focus-within {
      background: rgba(255, 255, 255, 0.34);
      border-color: #93c5fd;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.35);
    }

    .input-icon {
      width: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      color: #f8fafc;
      flex-shrink: 0;
    }

    .input-wrapper input {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      font-size: 14px;
      color: #ffffff;
      outline: none;
      padding-right: 10px;
    }

    .input-wrapper input::placeholder {
      color: rgba(241, 245, 249, 0.78);
    }

    .toggle-btn {
      width: 40px;
      height: 100%;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 15px;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Tombol semi-transparan bercahaya biru */
    .btn-submit {
      width: 100%;
      height: 44px;
      margin-top: 8px;
      border: 1px solid rgba(147, 197, 253, 0.55);
      border-radius: 8px;
      background: linear-gradient(
        180deg,
        rgba(37, 99, 235, 0.78) 0%,
        rgba(29, 78, 216, 0.85) 100%
      );
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
      transition: filter 0.15s ease, transform 0.1s ease, background 0.2s ease;
    }

    .btn-submit:hover {
      background: linear-gradient(
        180deg,
        rgba(37, 99, 235, 0.92) 0%,
        rgba(29, 78, 216, 0.96) 100%
      );
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    .footer-links {
      margin-top: 18px;
      font-size: 13px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
    }

    .forgot-link {
      display: inline-block;
      color: #e2e8f0;
      text-decoration: underline;
      margin-bottom: 10px;
    }

    .register-row {
      color: #e2e8f0;
    }

    .register-row a {
      color: #facc15;
      font-weight: 700;
      text-decoration: none;
      margin-left: 3px;
    }

    .register-row a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="glass-card">
    <div class="logo-header">
      <span class="music-note">♪</span>
      <span class="bee-badge">🐝</span>
      <span class="music-note">♫</span>
    </div>

    <div class="title-main">HACHI NET</div>
    <div class="title-sub">WARNASARI</div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input
            type="text"
            id="username"
            placeholder="Masukkan username"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input
            type="password"
            id="password"
            placeholder="Masukkan password"
            required
          />
          <button type="button" class="toggle-btn" id="togglePass" aria-label="Lihat password">
            👁️
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit">Masuk Sistem</button>
    </form>

    <div class="footer-links">
      <a href="#lupa-password" class="forgot-link">Lupa Password?</a>
      <div class="register-row">
        Belum punya akun? <a href="#daftar">Daftar</a>
      </div>
    </div>
  </div>

  <script>
    const togglePass = document.getElementById('togglePass');
    const passwordInput = document.getElementById('password');
    const loginForm = document.getElementById('loginForm');

    togglePass.addEventListener('click', () => {
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      togglePass.textContent = isHidden ? '🙈' : '👁️';
    });

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      alert('Login berhasil diproses untuk: ' + user);
    });
  </script>
</body>
</html>
