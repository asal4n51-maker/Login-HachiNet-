<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - HACHI NET WARNASARI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at 20% 25%, rgba(56, 189, 248, 0.25), transparent 45%),
        radial-gradient(circle at 80% 30%, rgba(250, 204, 21, 0.22), transparent 45%),
        radial-gradient(circle at 50% 85%, rgba(37, 99, 235, 0.35), transparent 55%),
        linear-gradient(135deg, #040914 0%, #09172e 50%, #050c1a 100%);
      overflow: hidden;
      position: relative;
      color: #ffffff;
    }

    /* Efek garis cahaya jaringan dekoratif */
    .bg-lines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(rgba(255, 215, 100, 0.55) 1.5px, transparent 1.5px),
        radial-gradient(rgba(125, 211, 252, 0.45) 1.5px, transparent 1.5px);
      background-size: 90px 90px, 130px 130px;
      background-position: 0 0, 45px 60px;
      opacity: 0.65;
    }

    .glow-arc-blue {
      position: fixed;
      width: 680px;
      height: 680px;
      border-radius: 50%;
      border: 2px solid rgba(56, 189, 248, 0.25);
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.15), inset 0 0 40px rgba(56, 189, 248, 0.1);
      top: -180px;
      left: -220px;
      pointer-events: none;
    }

    .glow-arc-gold {
      position: fixed;
      width: 720px;
      height: 720px;
      border-radius: 50%;
      border: 2px solid rgba(250, 204, 21, 0.22);
      box-shadow: 0 0 45px rgba(250, 204, 21, 0.12);
      bottom: -260px;
      right: -240px;
      pointer-events: none;
    }

    /* Kartu Glassmorphism */
    .login-card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 400px;
      padding: 34px 30px 28px;
      border-radius: 22px;
      background: rgba(15, 28, 48, 0.52);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.6),
        inset 0 1px 1px rgba(255, 255, 255, 0.25);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .bee-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      filter: drop-shadow(0 0 14px rgba(250, 204, 21, 0.85));
    }

    .brand-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1px;
      line-height: 1.15;
      text-transform: uppercase;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
    }

    .brand-subtitle {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 1.2px;
      margin-top: 2px;
      text-transform: uppercase;
      color: #f8fafc;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13.5px;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 7px;
    }

    .input-box {
      position: relative;
      display: flex;
      align-items: center;
      background: rgba(203, 213, 225, 0.88);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .input-box:focus-within {
      background: rgba(241, 245, 249, 0.96);
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.28);
    }

    .input-icon {
      padding: 0 11px;
      color: #475569;
      font-size: 15px;
      display: flex;
      align-items: center;
      user-select: none;
    }

    .input-box input {
      width: 100%;
      border: none;
      background: transparent;
      padding: 11px 10px 11px 0;
      font-size: 14px;
      color: #0f172a;
      outline: none;
    }

    .input-box input::placeholder {
      color: #64748b;
    }

    .toggle-pass {
      background: transparent;
      border: none;
      padding: 0 12px;
      color: #475569;
      cursor: pointer;
      font-size: 15px;
      display: flex;
      align-items: center;
    }

    .toggle-pass:hover {
      color: #0f172a;
    }

    .btn-login {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.45);
      transition: transform 0.15s ease, filter 0.2s ease;
    }

    .btn-login:hover {
      filter: brightness(1.08);
    }

    .btn-login:active {
      transform: scale(0.99);
    }

    .links {
      margin-top: 18px;
      text-align: center;
      font-size: 13px;
    }

    .forgot-link {
      display: inline-block;
      color: #cbd5e1;
      text-decoration: underline;
      margin-bottom: 10px;
    }

    .forgot-link:hover {
      color: #ffffff;
    }

    .register-text {
      color: #cbd5e1;
    }

    .register-link {
      color: #22c55e;
      font-weight: 700;
      text-decoration: none;
      margin-left: 3px;
    }

    .register-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="bg-lines"></div>
  <div class="glow-arc-blue"></div>
  <div class="glow-arc-gold"></div>

  <main class="login-card">
    <div class="brand-header">
      <div class="bee-icon" aria-hidden="true">🐝</div>
      <div class="brand-title">HACHI NET</div>
      <div class="brand-subtitle">WARNASARI</div>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-box">
          <span class="input-icon">👤</span>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Masukkan username"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-box">
          <span class="input-icon">🔒</span>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Masukkan password"
            required
          />
          <button type="button" class="toggle-pass" id="togglePassword" aria-label="Tampilkan password">
            👁️
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login">Masuk Sistem</button>
    </form>

    <div class="links">
      <a href="#lupa-password" class="forgot-link">Lupa Password?</a>
      <div class="register-text">
        Belum punya akun? <a href="#daftar" class="register-link">Daftar</a>
      </div>
    </div>
  </main>

  <script>
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const loginForm = document.getElementById('loginForm');

    toggleBtn.addEventListener('click', () => {
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      toggleBtn.textContent = isHidden ? '🙈' : '👁️';
    });

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      alert(`Mencoba login ke HACHI NET WARNASARI sebagai "${user}"...`);
    });
  </script>
</body>
</html>
