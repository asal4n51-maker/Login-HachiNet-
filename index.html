<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - HACHI NET WARNASARI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: #050b18;
      background-image: url('background-hachinet.jpg');
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }

    /* Overlay form yang diposisikan pas di bagian bawah kartu pada gambar */
    .login-overlay {
      width: 100%;
      max-width: 360px;
      margin-top: 175px;
      padding: 8px 14px 12px;
      border-radius: 16px;
      background: transparent;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 13.5px;
      font-weight: 600;
      color: #ffffff;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.85);
      margin-bottom: 5px;
    }

    .input-box {
      position: relative;
      display: flex;
      align-items: center;
      height: 40px;
      border-radius: 7px;
      background: rgba(215, 223, 232, 0.78);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .input-box:focus-within {
      background: rgba(235, 241, 248, 0.92);
      border-color: #60a5fa;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.45);
    }

    .input-icon {
      width: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4b5563;
      font-size: 14px;
      user-select: none;
      flex-shrink: 0;
    }

    .input-box input {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      padding-right: 8px;
      font-size: 13.5px;
      color: #111827;
      outline: none;
    }

    .input-box input::placeholder {
      color: #4b5563;
    }

    .toggle-pass {
      width: 38px;
      height: 100%;
      background: transparent;
      border: none;
      color: #4b5563;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .toggle-pass:hover {
      color: #111827;
    }

    .btn-login {
      width: 100%;
      height: 42px;
      margin-top: 10px;
      border: 1px solid rgba(147, 197, 253, 0.35);
      border-radius: 7px;
      background: linear-gradient(180deg, #2b6ef2 0%, #1d56cf 100%);
      color: #ffffff;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(29, 86, 207, 0.5);
      transition: transform 0.12s ease, filter 0.18s ease;
    }

    .btn-login:hover {
      filter: brightness(1.08);
    }

    .btn-login:active {
      transform: scale(0.99);
    }

    .links {
      margin-top: 14px;
      text-align: center;
      font-size: 12.5px;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
    }

    .forgot-link {
      display: inline-block;
      color: #e2e8f0;
      text-decoration: underline;
      margin-bottom: 8px;
    }

    .forgot-link:hover {
      color: #ffffff;
    }

    .register-text {
      color: #e2e8f0;
    }

    .register-link {
      color: #22c55e;
      font-weight: 700;
      text-decoration: none;
      margin-left: 2px;
    }

    .register-link:hover {
      text-decoration: underline;
    }

    /* Penyesuaian untuk layar HP sempit */
    @media (max-width: 420px) {
      .login-overlay {
        max-width: 310px;
        margin-top: 155px;
        padding: 6px 10px 10px;
      }

      .input-box {
        height: 36px;
      }

      .btn-login {
        height: 38px;
        font-size: 13.5px;
      }
    }
  </style>
</head>
<body>
  <main class="login-overlay">
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-box">
          <span class="input-icon" aria-hidden="true">👤</span>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Masukkan username"
            autocomplete="username"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-box">
          <span class="input-icon" aria-hidden="true">🔒</span>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Masukkan password"
            autocomplete="current-password"
            required
          />
          <button
            type="button"
            class="toggle-pass"
            id="togglePassword"
            aria-label="Tampilkan atau sembunyikan password"
          >
            👁️
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login">Masuk Sistem</button>
    </form>

    <div class="links">
      <a href="#lupa-password" class="forgot-link">Lupa Password?</a>
      <div class="register-text">
        Belum punya akun? <a href="#daftar" class="register-link">Daftar</a>
      </div>
    </div>
  </main>

  <script>
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const loginForm = document.getElementById('loginForm');

    toggleBtn.addEventListener('click', () => {
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      toggleBtn.textContent = isHidden ? '🙈' : '👁️';
    });

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = passwordInput.value;
      alert(`Login dikirim untuk username: ${username}`);
      // Ganti bagian ini dengan fetch('/api/login', ...) atau redirect ke halaman dashboard kamu
    });
  </script>
</body>
</html>
