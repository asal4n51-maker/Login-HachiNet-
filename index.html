<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - HACHI NET WARNASARI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: #050b18;
      background-image: url('background-hachinet.jpg');
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }

    /* Wadah transparan yang diposisikan pas menindih area form pada gambar */
    .form-hit-area {
      position: relative;
      width: 100%;
      max-width: 315px;
      margin-top: 178px;
      padding: 4px 8px;
    }

    .field-wrap {
      position: relative;
      width: 100%;
      height: 36px;
      margin-bottom: 24px;
      border-radius: 6px;
      background: transparent;
    }

    .field-wrap.password-wrap {
      margin-bottom: 14px;
    }

    .transparent-input {
      width: 100%;
      height: 100%;
      padding: 0 38px 0 34px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.01);
      color: #0f172a;
      font-size: 13.5px;
      font-weight: 600;
      outline: none;
    }

    /* Saat diketik atau difokuskan, beri latar terang tipis agar teks jelas terbaca */
    .transparent-input:focus,
    .transparent-input:not(:placeholder-shown) {
      background: rgba(226, 232, 240, 0.92);
      border-color: rgba(59, 130, 246, 0.75);
    }

    .transparent-input::placeholder {
      color: transparent;
    }

    .toggle-eye-btn {
      position: absolute;
      top: 0;
      right: 0;
      width: 36px;
      height: 100%;
      border: none;
      background: transparent;
      color: transparent;
      cursor: pointer;
      font-size: 14px;
    }

    .submit-btn {
      width: 100%;
      height: 38px;
      margin-top: 2px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: transparent;
      cursor: pointer;
    }

    .action-links {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .link-hotspot {
      display: inline-block;
      color: transparent;
      text-decoration: none;
      font-size: 12px;
      padding: 2px 10px;
      cursor: pointer;
    }

    .link-hotspot.forgot {
      width: 120px;
      height: 18px;
    }

    .link-hotspot.register {
      width: 165px;
      height: 20px;
    }

    @media (max-width: 420px) {
      .form-hit-area {
        max-width: 285px;
        margin-top: 162px;
      }

      .field-wrap {
        height: 32px;
        margin-bottom: 21px;
      }

      .field-wrap.password-wrap {
        margin-bottom: 12px;
      }

      .submit-btn {
        height: 34px;
      }
    }
  </style>
</head>
<body>
  <main class="form-hit-area">
    <form id="loginForm">
      <div class="field-wrap">
        <input
          type="text"
          id="username"
          name="username"
          class="transparent-input"
          placeholder="Username"
          autocomplete="username"
          required
        />
      </div>

      <div class="field-wrap password-wrap">
        <input
          type="password"
          id="password"
          name="password"
          class="transparent-input"
          placeholder="Password"
          autocomplete="current-password"
          required
        />
        <button
          type="button"
          id="togglePassword"
          class="toggle-eye-btn"
          aria-label="Tampilkan atau sembunyikan password"
        >👁️</button>
      </div>

      <button type="submit" class="submit-btn" aria-label="Masuk Sistem">Masuk Sistem</button>

      <div class="action-links">
        <a href="#lupa-password" id="forgotLink" class="link-hotspot forgot">Lupa Password?</a>
        <a href="#daftar" id="registerLink" class="link-hotspot register">Belum punya akun? Daftar</a>
      </div>
    </form>
  </main>

  <script>
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const loginForm = document.getElementById('loginForm');
    const forgotLink = document.getElementById('forgotLink');
    const registerLink = document.getElementById('registerLink');

    toggleBtn.addEventListener('click', () => {
      passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
    });

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      alert(`Login dikirim untuk username: ${username}`);
    });

    forgotLink.addEventListener('click', (e) => {
      e.preventDefault();
      alert('Fitur Lupa Password diklik.');
    });

    registerLink.addEventListener('click', (e) => {
      e.preventDefault();
      alert('Fitur Daftar akun baru diklik.');
    });
  </script>
</body>
</html>
