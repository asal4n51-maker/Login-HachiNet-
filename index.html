<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - HACHI NET WARNASARI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: #050b18;
      background-image: url('background-hachinet.jpg');
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }

    .login-container {
      width: 100%;
      max-width: 340px;
      margin-top: 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Tulisan HACHI NET WARNASARI di bawah lebah */
    .brand-title {
      text-align: center;
      margin-bottom: 18px;
      user-select: none;
    }

    .brand-main {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 1px;
      line-height: 1.08;
      text-transform: uppercase;
      color: #fde047;
      text-shadow:
        0 0 14px rgba(250, 204, 21, 0.8),
        0 3px 10px rgba(0, 0, 0, 0.95);
    }

    .brand-sub {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1.3px;
      line-height: 1.15;
      margin-top: 2px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow:
        0 0 12px rgba(255, 255, 255, 0.45),
        0 3px 10px rgba(0, 0, 0, 0.95);
    }

    /* Area interaktif yang diposisikan pas di atas form pada gambar */
    .form-hit-area {
      position: relative;
      width: 100%;
      max-width: 245px;
      margin-top: 26px;
    }

    .field-wrap {
      position: relative;
      width: 100%;
      height: 24px;
      margin-bottom: 18px;
      border-radius: 4px;
      background: transparent;
    }

    .field-wrap.password-wrap {
      margin-bottom: 10px;
    }

    .transparent-input {
      width: 100%;
      height: 100%;
      padding: 0 28px 0 26px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.01);
      color: #0f172a;
      font-size: 12px;
      font-weight: 600;
      outline: none;
    }

    .transparent-input:focus,
    .transparent-input:not(:placeholder-shown) {
      background: rgba(226, 232, 240, 0.92);
      border-color: rgba(59, 130, 246, 0.75);
    }

    .transparent-input::placeholder {
      color: transparent;
    }

    .toggle-eye-btn {
      position: absolute;
      top: 0;
      right: 0;
      width: 26px;
      height: 100%;
      border: none;
      background: transparent;
      color: transparent;
      cursor: pointer;
    }

    .submit-btn {
      width: 100%;
      height: 25px;
      margin-top: 2px;
      border: none;
      border-radius: 5px;
      background: transparent;
      color: transparent;
      cursor: pointer;
    }

    .action-links {
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .link-hotspot {
      display: inline-block;
      color: transparent;
      text-decoration: none;
      cursor: pointer;
    }

    .link-hotspot.forgot {
      width: 90px;
      height: 12px;
    }

    .link-hotspot.register {
      width: 130px;
      height: 14px;
    }

    @media (max-width: 420px) {
      .login-container {
        margin-top: 75px;
      }

      .brand-main {
        font-size: 22px;
      }

      .brand-sub {
        font-size: 18px;
      }

      .form-hit-area {
        max-width: 175px;
        margin-top: 42px;
      }

      .field-wrap {
        height: 18px;
        margin-bottom: 13px;
      }

      .field-wrap.password-wrap {
        margin-bottom: 8px;
      }

      .transparent-input {
        font-size: 11px;
        padding: 0 22px 0 20px;
      }

      .submit-btn {
        height: 19px;
      }
    }
  </style>
</head>
<body>
  <main class="login-container">
    <div class="brand-title">
      <div class="brand-main">HACHI NET</div>
      <div class="brand-sub">WARNASARI</div>
    </div>

    <div class="form-hit-area">
      <form id="loginForm">
        <div class="field-wrap">
          <input
            type="text"
            id="username"
            name="username"
            class="transparent-input"
            placeholder="Username"
            autocomplete="username"
            required
          />
        </div>

        <div class="field-wrap password-wrap">
          <input
            type="password"
            id="password"
            name="password"
            class="transparent-input"
            placeholder="Password"
            autocomplete="current-password"
            required
          />
          <button
            type="button"
            id="togglePassword"
            class="toggle-eye-btn"
            aria-label="Tampilkan atau sembunyikan password"
          >👁️</button>
        </div>

        <button type="submit" class="submit-btn" aria-label="Masuk Sistem">Masuk Sistem</button>

        <div class="action-links">
          <a href="#lupa-password" id="forgotLink" class="link-hotspot forgot">Lupa Password?</a>
          <a href="#daftar" id="registerLink" class="link-hotspot register">Belum punya akun? Daftar</a>
        </div>
      </form>
    </div>
  </main>

  <script>
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const loginForm = document.getElementById('loginForm');
    const forgotLink = document.getElementById('forgotLink');
    const registerLink = document.getElementById('registerLink');

    toggleBtn.addEventListener('click', () => {
      passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
    });

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      alert(`Login dikirim untuk username: ${username}`);
    });

    forgotLink.addEventListener('click', (e) => {
      e.preventDefault();
      alert('Fitur Lupa Password diklik.');
    });

    registerLink.addEventListener('click', (e) => {
      e.preventDefault();
      alert('Fitur Daftar akun baru diklik.');
    });
  </script>
</body>
</html>
